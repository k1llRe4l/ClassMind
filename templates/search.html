<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск материалов</title>
</head>
<body style="font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <h2>Введите поисковый запрос</h2>

    <!-- Форма отправляет GET-запрос на страницу /response -->
    <form action="{{ url_for('response_page') }}" method="GET">
        <input type="text" name="query" placeholder="Например: irregular verbs или прошедшее время" style="width: 300px; padding: 8px; font-size: 14px;" required>
        <button type="submit" style="padding: 8px 15px; font-size: 14px; cursor: pointer;">Найти</button>
    </form>

    <br><br>
    <a href="{{ url_for('index') }}">На главную</a>
</body>
</html>
